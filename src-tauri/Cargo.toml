[package]
name = "microswap"
version = "1.0.0"
description = "MicroSwap — Effortless Windows Wallpaper Switcher"
authors = ["MicroSwap"]
edition = "2021"

[lib]
name = "microswap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
blake3 = "1.5.5"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
rand = "0.8.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_Graphics_Dwm"
] }
